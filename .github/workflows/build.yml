name: Build & publish add-on image

# Se dispara al publicar un tag vX.Y.Z (el mismo que la versión de clean_assistant/config.yaml).
# Compila la imagen del add-on para cada arquitectura y la publica en GHCR:
#   ghcr.io/miguelsg29/clean-assistant-{arch}:X.Y.Z  (+ :latest)
# Home Assistant la descarga en vez de compilarla en el dispositivo.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, amd64, armv7]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (compilación multi-arquitectura)
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (${{ matrix.arch }})
        uses: home-assistant/builder@master
        with:
          args: |
            --${{ matrix.arch }} \
            --target clean_assistant \
            --image "clean-assistant-{arch}" \
            --docker-hub "ghcr.io/miguelsg29" \
            --addon
