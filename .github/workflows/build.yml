name: Build & publish add-on image

# Se dispara al publicar un tag vX.Y.Z (el mismo que la versión de clean_assistant/config.yaml).
# Compila la imagen del add-on con docker buildx para cada arquitectura y la publica en GHCR:
#   ghcr.io/miguelsg29/clean-assistant-{arch}:X.Y.Z  (+ :latest)
# Home Assistant la descarga en vez de compilarla en el dispositivo.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
          - arch: armv7
            platform: linux/arm/v7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (compilación multi-arquitectura)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Versión del tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: clean_assistant
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            APP_REF=${{ github.ref_name }}
          tags: |
            ghcr.io/miguelsg29/clean-assistant-${{ matrix.arch }}:${{ steps.ver.outputs.version }}
            ghcr.io/miguelsg29/clean-assistant-${{ matrix.arch }}:latest
