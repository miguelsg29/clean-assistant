name: Tests

# Pruebas automáticas (tests/run.py) en cada push y en cada PR. Usan robots simulados y datos
# inventados: no necesitan ningún robot, red ni secreto.
on:
  push:
    branches: ["main", "legacy-backend"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install -r requirements.txt

      - name: Pruebas
        run: python tests/run.py
