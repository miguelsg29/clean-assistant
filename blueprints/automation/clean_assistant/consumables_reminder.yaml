blueprint:
  name: Clean Assistant — consumables reminder
  description: >
    Reminds you to replace the brushes, filter or mop when their remaining life drops below
    a threshold, and (optionally) to clean the robot's sensors. Notifies as soon as it
    happens and then once a day at the time you choose until you reset it in Clean Assistant
    or Home Assistant ("Reset …" buttons).
  domain: automation
  source_url: https://github.com/miguelsg29/clean-assistant/blob/main/blueprints/automation/clean_assistant/consumables_reminder.yaml
  input:
    consumables:
      name: Consumables
      description: The robot's consumable sensors (main brush, side brush, filter, mop), in %.
      selector:
        entity:
          multiple: true
          filter:
            - domain: sensor
              integration: mqtt
    threshold:
      name: Remind below
      default: 10
      selector:
        number:
          min: 1
          max: 50
          unit_of_measurement: "%"
    sensor_due:
      name: '"Clean sensors" (optional)'
      description: The robot's "Clean sensors" binary sensor, to be reminded every 35 h of use.
      default: ""
      selector:
        entity:
          filter:
            - domain: binary_sensor
              integration: mqtt
    daily_time:
      name: Daily reminder at
      default: "20:00:00"
      selector:
        time: {}
    notify_device:
      name: Phone
      selector:
        device:
          filter:
            - integration: mobile_app

mode: single
max_exceeded: silent

trigger_variables:
  sensor_due: !input sensor_due

variables:
  consumables: !input consumables
  threshold: !input threshold
  low: >-
    {%- set ns = namespace(items=[]) -%}
    {%- for e in consumables -%}
      {%- set v = states(e) -%}
      {%- if is_number(v) and v | float < threshold | float -%}
        {%- set ns.items = ns.items + [((entity_name(e) if entity_name is defined else '') or state_attr(e, 'friendly_name') or e) ~ ' (' ~ (v | float | round(0) | int) ~ ' %)'] -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.items }}
  due: "{{ sensor_due not in ('', none) and is_state(sensor_due, 'on') }}"

triggers:
  - trigger: numeric_state
    entity_id: !input consumables
    below: !input threshold
  - trigger: template
    value_template: "{{ sensor_due not in ('', none) and is_state(sensor_due, 'on') }}"
  - trigger: time
    at: !input daily_time

conditions:
  - condition: template
    value_template: "{{ low | count > 0 or due }}"

actions:
  - device_id: !input notify_device
    domain: mobile_app
    type: notify
    title: "Robot maintenance"
    message: >
      {% set parts = [] %}
      {% if low | count > 0 %}{% set parts = parts + ['Replace soon: ' ~ (low | join(', '))] %}{% endif %}
      {% if due %}{% set parts = parts + ['Clean the robot sensors'] %}{% endif %}
      {{ parts | join('. ') }}
