# Imagen base por arquitectura para home-assistant/builder (rellena BUILD_FROM en el Dockerfile).
# Usamos Alpine 3.20 (igual que antes); el builder descarga la variante correcta de cada arch.
build_from:
  aarch64: alpine:3.20
  amd64: alpine:3.20
  armv7: alpine:3.20
# Enlaza el paquete de GHCR con este repositorio (aparece en la pestaña Packages del repo).
labels:
  org.opencontainers.image.source: https://github.com/miguelsg29/clean-assistant
  org.opencontainers.image.licenses: MIT
