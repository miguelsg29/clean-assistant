name: "Clean Assistant"
version: "0.32.1"
slug: "clean_assistant"
description: "Local (no-cloud) control for Cecotec Conga (8090 / 6090 / 7090 / 4690 / 9090 Ultra and more; 3090/4090 experimental; Rowenta X-plorer Serie 80 experimental): live map, room cleaning, zones, schedules, MQTT & Home Assistant."
url: "https://github.com/miguelsg29/clean-assistant"
# Imagen PRECOMPILADA (GitHub Actions -> GHCR). Con esto Home Assistant DESCARGA la imagen en vez
# de compilarla en el dispositivo: actualizaciones rápidas y con barra de progreso. La publica el
# workflow .github/workflows/build.yml en cada tag. {arch} lo sustituye el Supervisor.
image: "ghcr.io/miguelsg29/clean-assistant-{arch}"
arch:
  - aarch64
  - amd64
init: false
# Acceso a la API del Supervisor: para leer la IP LAN del host (para las instrucciones de
# DNS, no la IP interna de Docker) y la zona horaria de Home Assistant (para que los
# horarios no se disparen con desfase).
hassio_api: true
# Acceso a la API de Home Assistant Core (a través del proxy del Supervisor): para crear/
# descartar una persistent_notification en cuanto la propia conexión MQTT de la app se cae o
# se restablece (ver MqttBridge.ha_notify_provider / app.py:_on_mqtt_connectivity_change),
# sin depender de un automatismo externo que observe la entidad de disponibilidad.
homeassistant_api: true
# La interfaz web se abre desde la barra lateral de Home Assistant (ingress).
ingress: true
ingress_port: 8099
panel_icon: "mdi:robot-vacuum"
# El robot se conecta a estos puertos (redirige por DNS los dominios de Cecotec a HA):
#   9090 = control; 8001 = OTA (independencia de la nube); 8002/8006 = subida de historial.
#   4010/4030/4050 = solo con BACKEND "legacy" (generación 3xxx/4xxx: Conga 4090…).
ports:
  9090/tcp: 9090
  8001/tcp: 8001
  8002/tcp: 8002
  8006/tcp: 8006
  4010/tcp: 4010
  4030/tcp: 4030
  4050/tcp: 4050
# Descubrimiento del broker MQTT de Home Assistant (Mosquitto): si no rellenas los
# campos MQTT_* a mano, se autoconfiguran desde HA. "want" = opcional (la app funciona
# igual sin MQTT).
services:
  - mqtt:want
options:
  BACKEND: "new"
  ROBOT_IP: ""
  ROBOT_DID: 0
  ROBOT_USERID: 0
  ROBOT_SN: "PON_AQUI_EL_SN_DE_TU_ROBOT"
  ROBOT_MAC: "00:00:00:00:00:00"
  FACTORY_ID: "1003"
  PROJECT_TYPE: "CECOTECCRL350-1001"
  MQTT_HOST: ""
  MQTT_PORT: 1883
  MQTT_USER: ""
  MQTT_PASS: ""
  AUTH_JWT: ""
  DEFAULT_FAN: "Normal"
  DEFAULT_WATER: "Medio"
  DEFAULT_MOP: "Estándar"
  DEFAULT_MODE: "Auto"
schema:
  BACKEND: list(new|legacy|robeye)
  ROBOT_IP: str?
  ROBOT_DID: int
  ROBOT_USERID: int
  ROBOT_SN: str
  ROBOT_MAC: str
  FACTORY_ID: str
  PROJECT_TYPE: str
  MQTT_HOST: str?
  MQTT_PORT: int
  MQTT_USER: str?
  MQTT_PASS: password?
  AUTH_JWT: str?
  DEFAULT_FAN: list(Off|Eco|Normal|Turbo)
  DEFAULT_WATER: list(Off|Bajo|Medio|Alto)
  DEFAULT_MOP: list(Off|Estándar|Fuerte|Potente)
  DEFAULT_MODE: list(Auto|Fregado|Bordes|Espiral)
